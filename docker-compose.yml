version: '3.8'

services:
  # FleetOS Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleetos-frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    restart: unless-stopped
    networks:
      - fleetos-net

